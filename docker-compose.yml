services:
  backend:
    build: ./backend
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run python3 scripts/configure_local.py first}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ASSESSMENT_MAX_EVIDENCE_AGE_DAYS: ${ASSESSMENT_MAX_EVIDENCE_AGE_DAYS:-30}
      DATABASE_URL: sqlite:////app/data/myl.db
      EVIDENCE_DIR: /app/evidence
    volumes:
      - ./data:/app/data
      - ./evidence/runtime:/app/evidence
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
